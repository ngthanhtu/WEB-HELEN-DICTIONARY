<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helen Dictionary</title>
<style>
:root{
  --text-primary:#1d2a57; --text-inverse:#fff; --link:#5d2fc1; --accent:#fec400;
  --surface-base:#fff; --surface-muted:#7ef473; --surface-strong:#333; --text-green:#0e3e1b; --text-tertiary:#353b46;
  --space-1:2px;--space-2:4px;--space-3:8px;--space-4:12px;--space-5:16px;--space-6:24px;--space-7:40px;
  --radius-sm:20px;--radius-md:25px;--radius-pill:9999px;
  --shadow-1:rgba(0,0,0,.3) 4px 4px 10px 0;--shadow-inset:rgba(0,0,0,.1) 1px 1px 2px 0 inset;
  --font:Arial,Helvetica,sans-serif;
  --page-panel:rgba(255,255,255,.9); --page-wash:rgba(255,255,255,.72); --lookup-wash:rgba(255,255,255,.68);
  --page-image:url("/pexels-mart-production-7550534.jpg"); /* IMAGE 1: full-page background */
  --lookup-image:url("/Helennn.jpg"); /* IMAGE 2: heading-through-search background */
}
/* Toggle adapted from Uiverse.io by Javierrocadev. */
:root{color-scheme:light;--bar-bg:#1d2a57;--translation-bg:#f4f2fb;--border:#d9dce6;--error-bg:#fff1f1;--error-text:#8a1f1f}
:root[data-theme="dark"]{color-scheme:dark;--surface-base:#121827;--page-panel:rgba(18,24,39,.92);--text-primary:#e7edff;--text-tertiary:#b9c5da;--link:#c1a8ff;--surface-muted:#244b3b;--text-green:#c5f6d6;--surface-strong:#222e44;--bar-bg:#101a30;--translation-bg:#29243e;--border:#35415a;--error-bg:#40242c;--error-text:#ffc5cd;--page-wash:rgba(18,24,39,.82);--lookup-wash:rgba(18,24,39,.75)}
.theme-control{display:inline-flex;align-items:center;gap:10px;cursor:pointer;position:relative}
.theme-control input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.theme-track{position:relative;display:inline-block;width:96px;height:48px;flex:none;border-radius:999px;background:linear-gradient(90deg,#fb7185,#7f1d1d);box-shadow:1px 3px 0 #000;transition:background .3s}
.theme-track::after{content:"";position:absolute;top:4px;left:4px;width:40px;height:40px;border-radius:50%;background:conic-gradient(from 135deg,#b2a9a9,#b2a8a8,#fff,#d7dbd9,#fff,#b2a8a8);transition:transform .3s}
.theme-control input:checked + .theme-track{background:linear-gradient(90deg,#10b981,#064e3b)}
.theme-control input:checked + .theme-track::after{transform:translateX(48px) rotate(180deg)}
.theme-control input:focus-visible + .theme-track{outline:3px solid var(--accent);outline-offset:4px}
#voice-status{flex-basis:100%;font-size:14px}
*{box-sizing:border-box}
body{margin:0;font:400 16px/1.5 var(--font);color:var(--text-primary);background-color:var(--surface-base);background-image:linear-gradient(var(--page-wash),var(--page-wash)),var(--page-image);background-position:center;background-size:cover;background-repeat:no-repeat;background-attachment:fixed;min-height:100vh}
main{background:var(--page-panel);border-radius:var(--radius-md)}
a,button,select,input{font:inherit}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.bar{background:var(--bar-bg);color:var(--text-inverse);display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-6);gap:var(--space-5);flex-wrap:wrap}
.brand{font-weight:700;font-size:20px;display:flex;align-items:center;gap:var(--space-3)}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block}
.bar label{min-width:0;max-width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar select{max-width:100%;background:var(--surface-base);color:var(--text-primary);border:0;border-radius:var(--radius-pill);padding:var(--space-3) var(--space-5);min-height:40px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--space-7);align-items:center;padding:var(--space-7) var(--space-6);max-width:1200px;margin:auto}
.lookup-panel{overflow:hidden;border-radius:var(--radius-md);padding:var(--space-6);background-color:var(--surface-base);background-image:linear-gradient(var(--lookup-wash),var(--lookup-wash)),var(--lookup-image);background-size:cover;background-position:35% center;box-shadow:var(--shadow-1)}
.hero h1{font-size:44px;line-height:52.8px;font-weight:400;margin:0 0 var(--space-5);max-width:16ch}
.hero p{margin:0 0 var(--space-6);max-width:52ch;color:var(--text-tertiary)}
.search{display:flex;gap:var(--space-3);background:var(--surface-base);border:2px solid var(--text-primary);border-radius:var(--radius-pill);padding:var(--space-2);box-shadow:var(--shadow-inset)}
.search select{border:0;background:transparent;color:var(--text-primary);padding:0 var(--space-3);max-width:130px;min-height:44px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:0 var(--space-3);color:var(--text-primary);min-height:44px}
.search input:focus-visible{outline:0}
.search:focus-within{outline:3px solid var(--link);outline-offset:2px}
.btn{border:0;border-radius:var(--radius-pill);padding:var(--space-3) var(--space-6);min-height:44px;min-width:44px;font-weight:700;cursor:pointer;background:var(--accent);color:#1d2a57;transition:transform .15s}
.btn:hover{background:var(--surface-muted)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed}
.img-slot{aspect-ratio:4/3;border-radius:var(--radius-md);background:var(--surface-base);border:2px dashed var(--text-primary);overflow:hidden}
.img-slot img{width:100%;height:100%;object-fit:cover;display:block}
main{max-width:900px;margin:0 auto;padding:0 var(--space-6) var(--space-7)}
.status{padding:var(--space-5);border-radius:var(--radius-sm);background:var(--surface-muted);color:var(--text-green);margin:var(--space-5) 0}
.status.error{background:var(--error-bg);color:var(--error-text);border:2px solid var(--error-text)}
.entry{border-top:4px solid var(--accent);padding-top:var(--space-5);margin-top:var(--space-6)}
.hw{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-4)}
.hw h2{font-size:36px;margin:0;font-weight:700}
.ipa{font-size:18px;color:var(--link)}
.say{width:44px;height:44px;border-radius:50%;border:0;background:var(--bar-bg);color:var(--text-inverse);cursor:pointer;font-size:18px}
.say[aria-busy=true]{opacity:.6}
.pos{display:inline-block;background:var(--surface-strong);color:var(--text-inverse);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-4);font-size:14px;margin:var(--space-5) 0 var(--space-3)}
.sense{display:grid;grid-template-columns:1fr auto;gap:var(--space-3) var(--space-4);padding:var(--space-4) 0;border-bottom:1px solid var(--border)}
.def{font-weight:700;overflow-wrap:anywhere}
.ex{color:var(--text-tertiary);font-style:italic;margin-top:var(--space-2);grid-column:1}
.eye{width:44px;height:44px;border-radius:50%;border:2px solid var(--text-primary);background:var(--surface-base);cursor:pointer;color:var(--text-primary);grid-row:1/3;grid-column:2}
.eye[aria-pressed=true]{background:var(--surface-muted)}
.tr{grid-column:1/3;background:var(--translation-bg);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);color:var(--link);overflow-wrap:anywhere}
.tr[hidden]{display:none}
.example-say{width:32px;height:32px;font-size:14px;vertical-align:middle;margin-left:8px}
.meaning-heading{font-size:24px;margin:24px 0 8px}.meaning-heading em{font-size:17px;font-weight:400;margin-left:8px}
.sense-number{font-size:14px;display:inline-block;min-width:22px;color:var(--link)}
.examples{padding-left:30px;margin-bottom:0;font-weight:400}.examples li{margin:8px 0}
.sense-relations{grid-column:1/3;font-size:14px;padding:12px 16px;border-left:3px solid var(--accent);background:var(--translation-bg);border-radius:0 12px 12px 0}
.word-notes{margin:16px 0;background:var(--translation-bg);padding:14px 18px;border-radius:12px;font-size:14px}.word-notes summary{cursor:pointer;font-weight:700}.word-notes p{margin:8px 0}
.usage{padding:var(--space-4);background:var(--translation-bg);border-radius:var(--radius-sm)}
.usage p{margin:8px 0}
.syn{margin-top:var(--space-3);font-size:14px}
.src{font-size:13px;color:var(--text-tertiary);margin-top:var(--space-5)}
footer{background:var(--surface-strong);color:var(--text-inverse);padding:var(--space-6);text-align:center;font-size:14px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero h1{font-size:32px;line-height:40px}.search{flex-wrap:wrap;border-radius:var(--radius-md)}.search select{max-width:none;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><i aria-hidden="true"></i>Helen Dictionary</div>
  <label>Meanings in
    <select id="target" aria-label="Translate meanings into"></select>
  </label>
  <label>Voice <select id="voice" aria-label="Pronunciation voice"><option value="">Loading voices…</option></select></label>
  <!-- Toggle adapted from Uiverse.io by Javierrocadev -->
  <label class="theme-control">
    <input id="theme-toggle" type="checkbox" role="switch" aria-label="Dark mode">
    <span class="theme-track" aria-hidden="true"></span>
    <span id="theme-label">Light mode</span>
  </label>
  <span id="voice-status" role="status"></span>
</header>

<section class="hero">
  <div class="lookup-panel">
    <h1>Look up a word. Hear it. Read it in your language.</h1>
    <p>English definitions, IPA and your selected voice. Tap the eye to reveal the translation in any language you choose.</p>
    <form class="search" id="form" role="search">
      <select id="from" aria-label="Search language"></select>
      <input id="q" type="search" placeholder="Search a word" autocomplete="off" aria-label="Word to search" required>
      <button class="btn" type="submit">Search</button>
    </form>
  </div>
  <!-- Paste your image link in IMAGES.hero below. Empty = blank box. -->
  <div class="img-slot" id="slot-hero"></div>
</section>

<main id="out" aria-live="polite"></main>
<footer>Helen Dictionary</footer>

<script>
// ===== CONFIG =====
const API = ''; // '' = same server. Set e.g. 'https://yourdomain.com' if hosted separately.
const IMAGES = { hero: 'Helen1.jpg' }; // paste image URLs here
const LANGS = {en:'English',vi:'Tiếng Việt',es:'Español',fr:'Français',de:'Deutsch',it:'Italiano',pt:'Português',ru:'Русский',ja:'日本語',ko:'한국어','zh-CN':'中文 (简体)','zh-TW':'中文 (繁體)',ar:'العربية',hi:'हिन्दी',th:'ไทย',id:'Bahasa Indonesia',ms:'Bahasa Melayu',tr:'Türkçe',nl:'Nederlands',pl:'Polski',sv:'Svenska',el:'Ελληνικά',he:'עברית',uk:'Українська'};

const $ = s => document.querySelector(s);
const opt = (sel, def) => { sel.innerHTML = Object.entries(LANGS).map(([k,v]) => `<option value="${k}">${v}</option>`).join(''); sel.value = def; };
const stored = key => { try { return localStorage.getItem(key); } catch { return null; } };
const remember = (key, value) => { try { localStorage.setItem(key, value); } catch {} };
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $('#theme-toggle').checked = theme === 'dark';
  $('#theme-label').textContent = theme === 'dark' ? 'Dark mode' : 'Light mode';
}
applyTheme(stored('helen-theme') === 'dark' ? 'dark' : 'light');
$('#theme-toggle').addEventListener('change', () => {
  const theme = $('#theme-toggle').checked ? 'dark' : 'light';
  applyTheme(theme); remember('helen-theme', theme);
});
opt($('#target'), LANGS[stored('helen-target')] ? stored('helen-target') : 'vi'); opt($('#from'), LANGS[stored('helen-from')] ? stored('helen-from') : 'en');
$('#q').value = stored('helen-query') || '';
$('#q').addEventListener('input', () => remember('helen-query', $('#q').value));
$('#from').addEventListener('change', () => remember('helen-from', $('#from').value));
let selectedVoice = stored('helen-voice');
async function loadVoices() {
  const sel = $('#voice');
  try {
    const r = await fetch(`${API}/api/voices`);
    const data = await r.json(); if (!r.ok) throw new Error(data.error);
    selectedVoice ||= data.in_use;
    sel.replaceChildren();
    const voices = [...data.voices];
    if (!voices.some(v => v.voice_id === selectedVoice)) voices.unshift({voice_id:selectedVoice, name:'Saved voice (check account access)'});
    for (const v of voices) sel.add(new Option(`${v.name}${v.category === 'premade' ? ' (premade)' : ''}`, v.voice_id));
    sel.value = selectedVoice; remember('helen-voice', selectedVoice);
    $('#voice-status').textContent = 'Choose a voice available on your ElevenLabs plan.';
  } catch (e) {
    sel.replaceChildren(new Option(selectedVoice || 'Voice service unavailable', selectedVoice || ''));
    $('#voice-status').textContent = e.message;
  }
}
$('#voice').addEventListener('change', () => { selectedVoice = $('#voice').value; remember('helen-voice', selectedVoice); audio?.pause(); });
loadVoices();
if (IMAGES.hero) { const i = new Image(); i.src = IMAGES.hero; i.alt = ''; $('#slot-hero').append(i); }

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let audio, audioURL, lastResult;
let targetRequest = 0;
async function speak(text, btn) {
  btn.setAttribute('aria-busy', 'true');
  try {
    const r = await fetch(`${API}/api/tts?text=${encodeURIComponent(text)}${selectedVoice ? `&voice=${encodeURIComponent(selectedVoice)}` : ''}`);
    if (!r.ok) { const failure = await r.json().catch(() => ({})); throw new Error(failure.error || `Voice request failed (HTTP ${r.status}).`); }
    audio?.pause(); if (audioURL) URL.revokeObjectURL(audioURL);
    audioURL = URL.createObjectURL(await r.blob()); audio = new Audio(audioURL); await audio.play();
  } catch (e) {
    $('#voice-status').textContent = `${e.message || 'Selected voice is unavailable.'} Your selection has been kept.`;
  } finally { btn.removeAttribute('aria-busy'); }
}
async function tr(texts, from, to) {
  const r = await fetch(`${API}/api/translate`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({texts, from, to})});
  if (!r.ok) throw 0; return (await r.json()).translations;
}
function msg(t, err) { $('#out').innerHTML = `<div class="status ${err?'error':''}" role="${err?'alert':'status'}">${esc(t)}</div>`; }

let searchRequest = 0;
async function searchWord({ scroll = true } = {}) {
  const word = $('#q').value.trim(); if (!word) return;
  const from = $('#from').value, request = ++searchRequest;
  remember('helen-query', $('#q').value); remember('helen-from', from);
  lastResult = null; ++targetRequest;
  msg('Searching…');
  try {
    const r = await fetch(`${API}/api/lookup?word=${encodeURIComponent(word)}&from=${encodeURIComponent(from)}`);
    const d = await r.json();
    if (request !== searchRequest) return;
    if (!r.ok) return msg(d.error, true);
    render(d, scroll);
    if (d.enriching) {
      fetch(`${API}/api/lookup?word=${encodeURIComponent(d.word)}&from=en&details=1`)
        .then(async response => { if (!response.ok) throw new Error('Details unavailable'); return response.json(); })
        .then(details => {
          if (request !== searchRequest) return;
          const open = [...document.querySelectorAll('.eye')].flatMap((button, index) => button.getAttribute('aria-pressed') === 'true' ? [{index,text:button.parentElement.querySelector('.tr').textContent}] : []);
          render({...details, query:d.query, from:d.from}, false);
          const buttons = document.querySelectorAll('.eye');
          open.forEach(({index,text}) => {
            const button = buttons[index]; if (!button) return;
            button.setAttribute('aria-pressed', 'true'); button.setAttribute('aria-label', 'Hide translation'); button.textContent = '🙈';
            const box = button.parentElement.querySelector('.tr'); box.textContent = text; box.hidden = false;
          });
        })
        .catch(() => { if (request === searchRequest) document.querySelectorAll('.syn').forEach(el => { if (el.textContent.includes('Đang tải')) el.textContent = el.textContent.replace('Đang tải…', 'Chưa tải được dữ liệu bổ sung.'); }); });
    }
  } catch { if (request === searchRequest) msg('Cannot reach the server. Check that it is running.', true); }
}
$('#form').addEventListener('submit', e => { e.preventDefault(); searchWord(); });

async function updateWordTranslation() {
  const request = ++targetRequest, to = $('#target').value, result = lastResult;
  const box = $('#word-translation'); if (!box || !result) return;
  box.textContent = 'Translating word…';
  try {
    const translated = (await tr([result.word], 'en', to))[0];
    if (request === targetRequest && result === lastResult) box.textContent = `${LANGS[to]}: ${translated}`;
  } catch { if (request === targetRequest) box.textContent = 'Word translation failed. Try again.'; }
}
function render(d, scroll = true) {
  lastResult = d;
  const out = $('#out'); out.innerHTML = '';
  if (d.from !== 'en') out.insertAdjacentHTML('beforeend', `<div class="status">“${esc(d.query)}” in English: <strong>${esc(d.word)}</strong></div>`);
  out.insertAdjacentHTML('beforeend', '<div class="status" id="word-translation" role="status"></div>');
  updateWordTranslation();
  d.entries.forEach(en => {
    const el = document.createElement('article'); el.className = 'entry';
    el.innerHTML = `<div class="hw"><h2>${esc(en.word)}</h2>${en.ipa ? `<span class="ipa" aria-label="IPA">${esc(en.ipa)}</span>` : ''}<button class="say" type="button" aria-label="Hear pronunciation of ${esc(en.word)}">🔊</button></div>`;
    el.querySelector('.say').onclick = ev => speak(en.word, ev.currentTarget);
    en.meanings.forEach(m => {
      el.insertAdjacentHTML('beforeend', `<h3 class="meaning-heading">${esc(en.word)} <em>${esc(m.pos)}</em></h3>`);
      m.senses.forEach((s, index) => {
        const row = document.createElement('div'); row.className = 'sense';
        const examples = s.examples?.length ? s.examples : s.example ? [s.example] : [];
        row.innerHTML = `<div class="def"><span class="sense-number">${index + 1}</span> ${esc(s.definition)} <button class="say example-say definition-say" type="button" aria-label="Hear definition">🔊</button></div>${examples.length ? `<ul class="ex examples">${examples.map(example => `<li>“${esc(example)}” <button class="say example-say" type="button" aria-label="Hear example sentence">🔊</button></li>`).join('')}</ul>` : ''}
          <button class="eye" type="button" aria-pressed="false" aria-label="Show translation">👁</button><div class="tr" hidden></div>`;
        row.querySelector('.definition-say').onclick = ev => speak(s.definition, ev.currentTarget);
        if (examples.length) row.querySelectorAll('.ex .example-say').forEach((button, i) => { button.onclick = ev => speak(examples[i], ev.currentTarget); });
        const eye = row.querySelector('.eye'), box = row.querySelector('.tr');
        let lang = null;
        eye.onclick = async () => {
          const open = eye.getAttribute('aria-pressed') === 'true';
          if (open) { box.hidden = true; eye.setAttribute('aria-pressed','false'); eye.setAttribute('aria-label','Show translation'); eye.textContent='👁'; return; }
          const to = $('#target').value;
          if (lang !== to) { box.textContent = 'Translating…'; box.hidden = false;
            try { const translated = (await tr([s.definition], 'en', to))[0]; if ($('#target').value !== to) { box.hidden = true; return; } box.textContent = translated; lang = to; } catch { box.textContent = 'Translation failed. Try again.'; return; } }
          box.hidden = false; eye.setAttribute('aria-pressed','true'); eye.setAttribute('aria-label','Hide translation'); eye.textContent='🙈';
        };
        row.insertAdjacentHTML('beforeend', `<div class="sense-relations">
          <div class="syn"><strong>Từ đồng nghĩa:</strong> ${s.synonyms?.length ? s.synonyms.map(esc).join(', ') : m.relationsPending && !s.relationSource ? 'Đang tải…' : 'Chưa có từ đồng nghĩa được nguồn xác nhận cho nghĩa này.'}</div>
          <div class="syn"><strong>Từ trái nghĩa:</strong> ${s.antonyms?.length ? s.antonyms.map(esc).join(', ') : m.relationsPending && !s.relationSource ? 'Đang tải…' : 'Nguồn hiện tại không ghi nhận từ trái nghĩa trực tiếp cho nghĩa này.'}</div>
        </div>`);
        el.append(row);
      });
      const confirmedSynonyms = new Set(m.senses.flatMap(s => s.synonyms || []));
      const confirmedAntonyms = new Set(m.senses.flatMap(s => s.antonyms || []));
      const nearSynonyms = [...new Set([...(m.synonyms || []), ...(m.relatedSynonyms || [])])].filter(word => !confirmedSynonyms.has(word));
      const nearAntonyms = [...new Set([...(m.antonyms || []), ...(m.relatedAntonyms || [])])].filter(word => !confirmedAntonyms.has(word));
      if (nearSynonyms.length || nearAntonyms.length) el.insertAdjacentHTML('beforeend', `<details class="word-notes"><summary>Từ liên quan — ${esc(m.pos)}</summary>
        <p>Danh sách theo từ loại, chưa được gắn với từng nghĩa. Hãy đối chiếu ngữ cảnh trước khi thay thế.</p>
        ${nearSynonyms.length ? `<p><strong>Gợi ý gần nghĩa:</strong> ${nearSynonyms.map(esc).join(', ')}</p>` : ''}
        ${nearAntonyms.length ? `<p><strong>Gợi ý đối nghĩa:</strong> ${nearAntonyms.map(esc).join(', ')}</p>` : ''}
      </details>`);
      if (m.usageExamples?.length) {
        const usage = document.createElement('section'); usage.className = 'usage';
        usage.innerHTML = '<strong>Ví dụ khác từ nguồn bổ sung</strong><p>Các ví dụ này chưa được gắn với từng nghĩa ở trên.</p>';
        m.usageExamples.forEach(example => {
          const line = document.createElement('p');
          line.innerHTML = `“${esc(example)}” <button class="say example-say" type="button" aria-label="Hear usage example">🔊</button>`;
          line.querySelector('button').onclick = ev => speak(example, ev.currentTarget);
          usage.append(line);
        });
        el.append(usage);
      }
    });
    if (en.relatedSource) el.insertAdjacentHTML('beforeend', `<p class="src">Related words and additional examples: ${esc(en.relatedSource)}. Chọn từ thay thế theo nghĩa và ngữ cảnh; từ đồng nghĩa/trái nghĩa dưới mỗi nghĩa được nguồn xác nhận; gợi ý theo từ loại nằm trong mục Từ liên quan.</p>`);
    out.append(el);
  });
  if (d.entries[0].source) out.insertAdjacentHTML('beforeend', `<p class="src">Source: ${esc(d.entries[0].source)}</p>`);
  if (scroll) out.querySelector('h2')?.scrollIntoView({behavior:'smooth', block:'center'});
}
// Changing the target language closes open translations so they refresh on next tap.
$('#target').addEventListener('change', () => {
  remember('helen-target', $('#target').value);
  document.querySelectorAll('.tr').forEach(box => { box.hidden = true; });
  document.querySelectorAll('.eye').forEach(b => { b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', 'Show translation'); b.textContent = '👁'; });
  updateWordTranslation();
});
// Re-run the saved lookup so results remain current after a reload.
if ($('#q').value.trim()) searchWord({ scroll: false });
</script>
