name: Secret scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked files
        run: node scripts/check-secrets.cjs
      - name: Check reachable Git history
        run: node scripts/check-secrets.cjs --history
